{% extends 'base.html' %}
{% block content %}
<h3>Apply for {{ job.title }}</h3>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Upload Resume:</label>
<input type="file" name="resume" required>
    <br><br>
    <button type="submit">Submit Application</button>
</form>
{% endblock %}
